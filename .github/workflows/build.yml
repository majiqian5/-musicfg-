name: Build Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --depth 1 --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
      
      - name: Clone SDKs repo
        run: |
          export THEOS=~/theos
          # 用 git clone 整个仓库，更可靠
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          
          # 列出所有可用的 SDK
          echo "=== 可用 SDK 列表 ==="
          ls -la /tmp/ios-sdks/ | grep iPhoneOS
          
          # 复制所有 SDK 到 Theos
          cp -r /tmp/ios-sdks/iPhoneOS*.sdk $THEOS/sdks/
          
          echo "=== Theos SDK 目录 ==="
          ls -la $THEOS/sdks/
      
      - name: Install Tools
        run: |
          brew install dpkg ldid
      
      - name: Auto detect SDK
        run: |
          export THEOS=~/theos
          
          # 自动找最新的 SDK
          SDK_DIR=$(ls -d $THEOS/sdks/iPhoneOS*.sdk | head -1)
          SDK_NAME=$(basename $SDK_DIR)
          SDK_VERSION=$(echo $SDK_NAME | sed 's/iPhoneOS//;s/.sdk//')
          
          echo "找到 SDK: $SDK_NAME (版本 $SDK_VERSION)"
          
          # 修改 Makefile
          sed -i '' "s/iphone:clang:[0-9.]*:/iphone:clang:$SDK_VERSION:/" Makefile
          
          echo "修改后的 Makefile 前5行:"
          head -5 Makefile
      
      - name: Build
        run: |
          export THEOS=~/theos
          export PATH="$THEOS/bin:$PATH"
          
          echo "=== 开始编译 ==="
          make package FINALPACKAGE=1 2>&1 | tail -50
          
          echo "=== 编译结果 ==="
          ls -lh packages/
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: musicfg-deb
          path: packages/*.deb
