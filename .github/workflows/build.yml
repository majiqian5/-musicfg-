name: Build Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --depth 1 --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
      
      - name: Clone SDKs
        run: |
          export THEOS=~/theos
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          
          # 选最新的 SDK（16.0以上）
          echo "=== 所有 SDK ==="
          ls -d /tmp/ios-sdks/iPhoneOS*.sdk
          
          # 复制 16.5 SDK
          if [ -d "/tmp/ios-sdks/iPhoneOS16.5.sdk" ]; then
            cp -r /tmp/ios-sdks/iPhoneOS16.5.sdk $THEOS/sdks/
            echo "使用 SDK: iPhoneOS16.5.sdk"
          elif [ -d "/tmp/ios-sdks/iPhoneOS17.5.sdk" ]; then
            cp -r /tmp/ios-sdks/iPhoneOS17.5.sdk $THEOS/sdks/
            echo "使用 SDK: iPhoneOS17.5.sdk"
          else
            # 找最新的
            LATEST=$(ls -d /tmp/ios-sdks/iPhoneOS*.sdk | sort -V | tail -1)
            cp -r $LATEST $THEOS/sdks/
            echo "使用最新 SDK: $(basename $LATEST)"
          fi
          
          echo "=== Theos SDK 目录 ==="
          ls -la $THEOS/sdks/
      
      - name: Install Tools
        run: |
          brew install dpkg ldid
      
      - name: Fix Makefile
        run: |
          export THEOS=~/theos
          
          # 获取 SDK 版本
          SDK_DIR=$(ls -d $THEOS/sdks/iPhoneOS*.sdk | head -1)
          SDK_NAME=$(basename $SDK_DIR)
          SDK_VERSION=$(echo $SDK_NAME | sed 's/iPhoneOS//;s/.sdk//')
          
          echo "SDK 版本: $SDK_VERSION"
          
          # 修改 Makefile 中的 SDK 版本
          sed -i '' "s/iphone:clang:[0-9.]*:/iphone:clang:$SDK_VERSION:/" Makefile
          
          echo "=== Makefile ==="
          cat Makefile
      
      - name: Build
        run: |
          export THEOS=~/theos
          export PATH="$THEOS/bin:$PATH"
          
          echo "=== 开始编译 ==="
          make package FINALPACKAGE=1
          
          echo "=== 编译成功 ==="
          ls -lh packages/
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: musicfg-deb
          path: packages/*.deb
