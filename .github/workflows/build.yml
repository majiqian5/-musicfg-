name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    container:
      image: theosdocker/theos:latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build
        run: |
          make package FINALPACKAGE=1
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: musicfg-deb
          path: packages/*.deb
