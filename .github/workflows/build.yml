name: Build Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --depth 1 --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
      
      - name: Get SDK
        run: |
          export THEOS=~/theos
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/sdks
          cp -r /tmp/sdks/iPhoneOS16.5.sdk $THEOS/sdks/
      
      - name: Install Tools
        run: |
          brew install dpkg ldid
      
      - name: Build
        run: |
          export THEOS=~/theos
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1
          
          # 创建 entitlements 文件（半越狱需要的权限）
          cat > /tmp/ent.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.no-container</key>
              <true/>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # 手动重新签名 dylib
          echo "=== Re-signing dylib ==="
          ldid -S/tmp/ent.xml .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
          
          # 把 filter plist 转成二进制格式
          echo "=== Converting plist to binary ==="
          plutil -convert binary1 .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.plist
          
          # 重新打包
          echo "=== Repackaging ==="
          cd .theos/_
          dpkg-deb -b ../../packages/com.liuf.musicfg_2.0.0_iphoneos-arm64.deb .
          cd ../..
          
          ls -lh packages/
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: musicfg-deb
          path: packages/*.deb
