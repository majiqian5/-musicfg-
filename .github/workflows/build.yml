name: Build Tweak

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    
    strategy:
      matrix:
        include:
          - sdk: "iPhoneOS16.5.sdk"
            sdk_url: "https://github.com/xybp888/iOS-SDKs/raw/master/iPhoneOS16.5.sdk.zip"
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v3
        with:
          path: ~/theos
          key: ${{ runner.os }}-theos-v2
      
      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
      
      - name: Cache SDK
        id: cache-sdk
        uses: actions/cache@v3
        with:
          path: ~/theos/sdks/${{ matrix.sdk }}
          key: ${{ runner.os }}-${{ matrix.sdk }}
      
      - name: Download SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          export THEOS=~/theos
          curl -L "${{ matrix.sdk_url }}" -o /tmp/sdk.zip
          unzip -q /tmp/sdk.zip -d $THEOS/sdks/
          ls -la $THEOS/sdks/
      
      - name: Install Dependencies
        run: |
          brew install dpkg ldid
      
      - name: Build Package
        run: |
          export THEOS=~/theos
          export PATH="$THEOS/bin:$PATH"
          
          echo "=== Building ==="
          make clean
          make package FINALPACKAGE=1
          
          echo "=== Output ==="
          ls -lh packages/
      
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: musicfg_${{ github.sha }}
          path: packages/*.deb
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
