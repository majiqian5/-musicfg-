name: Radare2 Constructor Full

on:
  workflow_dispatch:

jobs:
  constructor:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Tools
        run: |
          brew install dpkg
          brew install radare2
      
      - name: Extract Original
        run: |
          mkdir -p original_extracted
          dpkg-deb -x original.deb original_extracted 2>/dev/null || dpkg-deb -x original_v1.deb original_extracted
          DYLIB=$(find original_extracted -name "*.dylib" -type f | head -1)
          echo "DYLIB=$DYLIB" >> $GITHUB_ENV
      
      - name: Full Constructor Disassembly
        run: |
          echo "=== FULL CONSTRUCTOR (124 bytes) ==="
          r2 -q -e bin.relocs.apply=true -c "aaa; pd 124 @ sym.func.0000690c" "$DYLIB"
      
      - name: All Strings
        run: |
          echo "=== ALL STRINGS ==="
          r2 -q -e bin.relocs.apply=true -c "aaa; iz" "$DYLIB" | head -100
