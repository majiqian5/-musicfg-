name: Test Signing

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Tools
        run: |
          brew install dpkg ldid
      
      - name: Extract Original
        run: |
          mkdir -p original_extracted
          dpkg-deb -x original.deb original_extracted
          dpkg-deb -e original.deb original_extracted/DEBIAN
          
          echo "=== Original dylib ==="
          file original_extracted/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
          echo "=== Original codesign ==="
          codesign -dvvv original_extracted/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib 2>&1 || echo "codesign failed"
      
      - name: Re-sign Original
        run: |
          export DYLIB=original_extracted/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
          
          # 用 ldid 重新签名
          echo "=== Re-signing with ldid -S ==="
          ldid -S $DYLIB
          
          echo "=== After re-sign ==="
          file $DYLIB
      
      - name: Repack
        run: |
          mkdir -p packages
          dpkg-deb -b original_extracted packages/musicfg_resigned.deb
          ls -lh packages/
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: resigned-test
          path: packages/musicfg_resigned.deb
