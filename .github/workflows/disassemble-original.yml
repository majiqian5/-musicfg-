name: Disassemble Original

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Tools
        run: |
          brew install dpkg radare2
      
      - name: Extract Original
        run: |
          mkdir -p original_extracted
          dpkg-deb -x original.deb original_extracted
      
      - name: Analyze ObjC Methods
        run: |
          DYLIB=original_extracted/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
          
          echo "=== All classes and methods ==="
          r2 -qc "ioc" $DYLIB 2>/dev/null || echo "r2 ioc failed"
          
          echo ""
          echo "=== PLPlatterView category methods ==="
          r2 -qc "ioc~PLPlatterView" $DYLIB 2>/dev/null || echo "search failed"
      
      - name: Disassemble Key Methods
        run: |
          DYLIB=original_extracted/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
          
          echo "=== didMoveToWindow (if exists) ==="
          r2 -qc "afl~didMoveToWindow" $DYLIB 2>/dev/null || echo "search failed"
          
          echo ""
          echo "=== applyBaseEffects ==="
          r2 -qc "afl~applyBaseEffects" $DYLIB 2>/dev/null || echo "search failed"
          
          echo ""
          echo "=== All functions ==="
          r2 -qc "afl" $DYLIB 2>/dev/null | head -50
      
      - name: Strings Analysis
        run: |
          DYLIB=original_extracted/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
          
          echo "=== All strings ==="
          r2 -qc "iz" $DYLIB 2>/dev/null | head -100
