name: Radare2 Analyze Original

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Tools
        run: |
          brew install dpkg
          brew install radare2 || echo "radare2 install failed, trying alternative"
          
          # 尝试用 pip 安装 r2pipe
          pip3 install r2pipe 2>/dev/null || true
          
          which r2
          r2 -v
      
      - name: Extract Original
        run: |
          mkdir -p original_extracted
          dpkg-deb -x original.deb original_extracted 2>/dev/null || dpkg-deb -x original_v1.deb original_extracted
          DYLIB=$(find original_extracted -name "*.dylib" -type f | head -1)
          echo "DYLIB=$DYLIB" >> $GITHUB_ENV
      
      - name: List All Functions
        run: |
          echo "=== ALL FUNCTIONS ==="
          r2 -q -c "afl" "$DYLIB" | sort
      
      - name: Find Hook Functions
        run: |
          echo "=== HOOK RELATED ==="
          r2 -q -c "afl~hook" "$DYLIB" || true
          r2 -q -c "afl~MSHook" "$DYLIB" || true
          r2 -q -c "afl~msgSend" "$DYLIB" || true
      
      - name: Find didMoveToWindow
        run: |
          echo "=== didMoveToWindow ==="
          r2 -q -c "afl~didMove" "$DYLIB" || true
          r2 -q -c "afl~moveToWindow" "$DYLIB" || true
      
      - name: Find PLPlatterView
        run: |
          echo "=== PLPlatterView ==="
          r2 -q -c "iz~PLPlatterView" "$DYLIB" || true
      
      - name: Disassemble Constructor
        run: |
          echo "=== CONSTRUCTOR ==="
          # 找 constructor 函数
          r2 -q -c "afl~init" "$DYLIB" | head -20
          r2 -q -c "afl~constructor" "$DYLIB" | head -20
          r2 -q -c "afl~_mod" "$DYLIB" | head -20
      
      - name: All Strings
        run: |
          echo "=== ALL STRINGS ==="
          r2 -q -c "iz" "$DYLIB" | sort
