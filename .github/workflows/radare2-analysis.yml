name: Radare2 Analyze Original

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Tools
        run: |
          brew install dpkg
          brew install radare2
          which r2
      
      - name: Extract Original
        run: |
          mkdir -p original_extracted
          dpkg-deb -x original.deb original_extracted 2>/dev/null || dpkg-deb -x original_v1.deb original_extracted
          DYLIB=$(find original_extracted -name "*.dylib" -type f | head -1)
          echo "DYLIB=$DYLIB" >> $GITHUB_ENV
      
      - name: Analyze and List Functions
        run: |
          echo "=== ALL FUNCTIONS ==="
          r2 -q -e bin.relocs.apply=true -c "aaa; afl" "$DYLIB" | sort
      
      - name: Find Hook Functions
        run: |
          echo "=== HOOK RELATED ==="
          r2 -q -e bin.relocs.apply=true -c "aaa; afl~hook" "$DYLIB" || true
          r2 -q -e bin.relocs.apply=true -c "aaa; afl~MSHook" "$DYLIB" || true
      
      - name: Find didMove
        run: |
          echo "=== didMove ==="
          r2 -q -e bin.relocs.apply=true -c "aaa; afl~didMove" "$DYLIB" || true
      
      - name: Find PLPlatterView
        run: |
          echo "=== PLPlatterView ==="
          r2 -q -e bin.relocs.apply=true -c "aaa; iz~PLPlatterView" "$DYLIB" || true
      
      - name: Disassemble Main Function
        run: |
          echo "=== MAIN / ENTRY ==="
          r2 -q -e bin.relocs.apply=true -c "aaa; iE" "$DYLIB" | head -30
