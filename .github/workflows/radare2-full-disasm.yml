name: Radare2 Full Disasm

on:
  workflow_dispatch:

jobs:
  full-disasm:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Tools
        run: |
          brew install dpkg
          brew install radare2
      
      - name: Extract Original
        run: |
          mkdir -p original_extracted
          dpkg-deb -x original.deb original_extracted 2>/dev/null || dpkg-deb -x original_v1.deb original_extracted
          DYLIB=$(find original_extracted -name "*.dylib" -type f | head -1)
          echo "DYLIB=$DYLIB" >> $GITHUB_ENV
      
      - name: Full func 0x6dac
        run: |
          echo "=== FUNC 0x6dac (836 bytes) ==="
          r2 -q -e bin.relocs.apply=true -c "aaa; pd 836 @ sym.func.00006dac" "$DYLIB"
      
      - name: Full func 0x6988
        run: |
          echo "=== FUNC 0x6988 (1060 bytes) ==="
          r2 -q -e bin.relocs.apply=true -c "aaa; pd 1060 @ sym.func.00006988" "$DYLIB"
