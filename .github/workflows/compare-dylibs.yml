name: Fix Dylib

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --depth 1 --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
      
      - name: Get SDK
        run: |
          export THEOS=~/theos
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/sdks
          cp -r /tmp/sdks/iPhoneOS16.5.sdk $THEOS/sdks/
      
      - name: Install Tools
        run: |
          brew install dpkg ldid
      
      - name: Build
        run: |
          export THEOS=~/theos
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1
      
      - name: Fix Dylib
        run: |
          export OUR_DYLIB=.theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
          
          echo "=== Before fix ==="
          otool -L $OUR_DYLIB
          
          # 1. 把 CydiaSubstrate 从绝对路径改成 @rpath 相对路径
          echo "=== Fixing CydiaSubstrate path ==="
          install_name_tool -change \
            /Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate \
            @rpath/CydiaSubstrate.framework/CydiaSubstrate \
            $OUR_DYLIB
          
          # 2. 删掉所有旧的 rpath
          echo "=== Cleaning old rpaths ==="
          while otool -l $OUR_DYLIB | grep -q LC_RPATH; do
            RPATH=$(otool -l $OUR_DYLIB | grep -A2 LC_RPATH | grep path | awk '{print $2}' | head -1)
            if [ -z "$RPATH" ]; then break; fi
            install_name_tool -delete_rpath "$RPATH" $OUR_DYLIB 2>/dev/null || break
          done
          
          # 3. 添加原版的 rpath
          echo "=== Adding original rpaths ==="
          install_name_tool -add_rpath /var/jb/Library/Frameworks $OUR_DYLIB
          install_name_tool -add_rpath /var/jb/usr/lib $OUR_DYLIB
          install_name_tool -add_rpath @loader_path/.jbroot/Library/Frameworks $OUR_DYLIB
          install_name_tool -add_rpath @loader_path/.jbroot/usr/lib $OUR_DYLIB
          
          # 4. 把 install name 也改成和原版类似的（可选，但是保险）
          install_name_tool -id @rpath/musicfg.dylib $OUR_DYLIB
          
          # 5. 重新签名
          echo "=== Re-signing ==="
          ldid -S $OUR_DYLIB
          
          # 6. 验证
          echo "=== After fix ==="
          otool -L $OUR_DYLIB
          echo "--- RPATH ---"
          otool -l $OUR_DYLIB | grep -A2 LC_RPATH
          
          # 7. plist 转二进制
          plutil -convert binary1 .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.plist
          
          # 8. 重新打包
          echo "=== Repackaging ==="
          cd .theos/_
          dpkg-deb -b . ../../packages/musicfg_fixed.deb
          cd ../..
          
          ls -lh packages/
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: musicfg-fixed
          path: packages/musicfg_fixed.deb
