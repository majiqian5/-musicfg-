name: Fix Dylib

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --depth 1 --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
      
      - name: Get SDK
        run: |
          export THEOS=~/theos
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/sdks
          cp -r /tmp/sdks/iPhoneOS16.5.sdk $THEOS/sdks/
      
      - name: Install Tools
        run: |
          brew install dpkg ldid
      
      - name: Build
        run: |
          export THEOS=~/theos
          export PATH="$THEOS/bin:$PATH"
          
          # 关键：不链接 CydiaSubstrate，运行时动态查找符号
          export LDFLAGS="-undefined dynamic_lookup"
          
          make package FINALPACKAGE=1
          
          # 检查编译结果
          echo "=== Dependencies ==="
          otool -L .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
      
      - name: Add RPath and Package
        run: |
          export OUR_DYLIB=.theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
          
          # 添加 rpath（尽量少修改 dylib）
          install_name_tool -add_rpath /var/jb/Library/Frameworks $OUR_DYLIB
          install_name_tool -add_rpath /var/jb/usr/lib $OUR_DYLIB
          
          # 重新签名
          ldid -S $OUR_DYLIB
          
          # 验证
          echo "=== Final Dependencies ==="
          otool -L $OUR_DYLIB
          echo "=== Final RPATH ==="
          otool -l $OUR_DYLIB | grep -A2 LC_RPATH
          
          # plist 转二进制
          plutil -convert binary1 .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.plist
          
          # 重新打包
          cd .theos/_
          dpkg-deb -b . ../../packages/musicfg_fixed.deb
          cd ../..
          
          ls -lh packages/
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: musicfg-fixed
          path: packages/musicfg_fixed.deb
