name: Compare Dylibs

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --depth 1 --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
      
      - name: Get SDK
        run: |
          export THEOS=~/theos
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/sdks
          cp -r /tmp/sdks/iPhoneOS16.5.sdk $THEOS/sdks/
      
      - name: Install Tools
        run: |
          brew install dpkg ldid
      
      - name: Build Our Dylib
        run: |
          export THEOS=~/theos
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1
      
      - name: Extract Original
        run: |
          mkdir -p original_extracted
          dpkg-deb -x original.deb original_extracted
      
      - name: Compare Dylibs
        run: |
          echo "=== Original Dylib ==="
          echo "--- Dependencies ---"
          otool -L original_extracted/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
          echo ""
          echo "--- RPATH ---"
          otool -l original_extracted/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib | grep -A2 LC_RPATH
          echo ""
          echo "--- Install Name ---"
          otool -D original_extracted/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
          
          echo ""
          echo "=== Our Dylib ==="
          echo "--- Dependencies ---"
          otool -L .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
          echo ""
          echo "--- RPATH ---"
          otool -l .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib | grep -A2 LC_RPATH
          echo ""
          echo "--- Install Name ---"
          otool -D .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
      
      - name: Fix Our Dylib
        run: |
          # 复制原版的 rpath 设置
          export OUR_DYLIB=.theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
          
          # 先删掉所有现有的 rpath
          echo "=== Cleaning up rpaths ==="
          while otool -l $OUR_DYLIB | grep -q LC_RPATH; do
            RPATH=$(otool -l $OUR_DYLIB | grep -A2 LC_RPATH | grep path | awk '{print $2}' | head -1)
            if [ -z "$RPATH" ]; then break; fi
            install_name_tool -delete_rpath "$RPATH" $OUR_DYLIB 2>/dev/null || break
          done
          
          # 添加原版的 rpath
          echo "=== Adding original rpaths ==="
          install_name_tool -add_rpath /var/jb/Library/Frameworks $OUR_DYLIB
          install_name_tool -add_rpath /var/jb/usr/lib $OUR_DYLIB
          install_name_tool -add_rpath @loader_path/.jbroot/Library/Frameworks $OUR_DYLIB
          install_name_tool -add_rpath @loader_path/.jbroot/usr/lib $OUR_DYLIB
          
          # 重新签名
          echo "=== Re-signing ==="
          ldid -S $OUR_DYLIB
          
          # 验证
          echo "=== Fixed RPATH ==="
          otool -l $OUR_DYLIB | grep -A2 LC_RPATH
          
          # 重新打包
          echo "=== Repackaging ==="
          cd .theos/_
          dpkg-deb -b . ../../packages/musicfg_fixed_rpath.deb
          cd ../..
          
          ls -lh packages/
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fixed-rpath
          path: packages/musicfg_fixed_rpath.deb
