name: Fix Dylib

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --depth 1 --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
      
      - name: Get SDK
        run: |
          export THEOS=~/theos
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/sdks
          cp -r /tmp/sdks/iPhoneOS16.5.sdk $THEOS/sdks/
      
      - name: Install Tools
        run: |
          brew install dpkg ldid
      
      - name: Fix CydiaSubstrate TBD
        run: |
          export THEOS=~/theos
          
          # 找到 CydiaSubstrate 的 tbd 文件并修改 install name
          TBD_FILE="$THEOS/lib/CydiaSubstrate.framework/CydiaSubstrate.tbd"
          if [ -f "$TBD_FILE" ]; then
            echo "Found tbd at $TBD_FILE"
            # 把绝对路径改成 @rpath 相对路径
            sed -i '' 's|/Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate|@rpath/CydiaSubstrate.framework/CydiaSubstrate|g' "$TBD_FILE"
            echo "Modified tbd:"
            cat "$TBD_FILE"
          else
            echo "TBD not found at expected path, searching..."
            find $THEOS -name "*.tbd" | grep -i substrate
          fi
      
      - name: Build
        run: |
          export THEOS=~/theos
          export PATH="$THEOS/bin:$PATH"
          
          make package FINALPACKAGE=1
          
          # 检查编译结果
          echo "=== Dependencies ==="
          otool -L .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
          echo ""
          echo "=== RPATH ==="
          otool -l .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib | grep -A2 LC_RPATH
      
      - name: Add RPath and Package
        run: |
          export OUR_DYLIB=.theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.dylib
          
          # 添加 rpath（用 -add_rpath 而不是删除重建，减少修改）
          install_name_tool -add_rpath /var/jb/Library/Frameworks $OUR_DYLIB
          install_name_tool -add_rpath /var/jb/usr/lib $OUR_DYLIB
          install_name_tool -add_rpath @loader_path/.jbroot/Library/Frameworks $OUR_DYLIB
          install_name_tool -add_rpath @loader_path/.jbroot/usr/lib $OUR_DYLIB
          
          # 重新签名
          ldid -S $OUR_DYLIB
          
          # 验证
          echo "=== Final RPATH ==="
          otool -l $OUR_DYLIB | grep -A2 LC_RPATH
          
          # plist 转二进制
          plutil -convert binary1 .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/musicfg.plist
          
          # 重新打包
          cd .theos/_
          dpkg-deb -b . ../../packages/musicfg_fixed.deb
          cd ../..
          
          ls -lh packages/
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: musicfg-fixed
          path: packages/musicfg_fixed.deb
